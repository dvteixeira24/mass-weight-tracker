dth="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="27" y1="526" x2="363" y2="526" stroke="#343d35" stroke-width="1"/><rect x="27" y="571" width="336" height="122" rx="0" fill="#1d2420" stroke="#343d35" stroke-width="1"/><path d="M48 592 V608 M40 600 H56 M43 595 L53 605 M53 595 L43 605" stroke="#c5f17c" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="602" font-family="Arial,sans-serif" font-size="14" fill="#f2f3eb" font-weight="600" text-anchor="start">Private by design</text><text x="80" y="625" font-family="Arial,sans-serif" font-size="11" fill="#a0aba1" font-weight="400" text-anchor="start">Your entries are stored in this browser,</text><text x="80" y="644" font-family="Arial,sans-serif" font-size="11" fill="#a0aba1" font-weight="400" text-anchor="start">on this device. Nothing is uploaded</text><text x="80" y="663" font-family="Arial,sans-serif" font-size="11" fill="#a0aba1" font-weight="400" text-anchor="start">to a server by this prototype.</text><text x="27" y="736" font-family="Arial,sans-serif" font-size="9" fill="#77877a" font-weight="700" text-anchor="start" letter-spacing="1">MASS / DESIGN PROTOTYPE / V1.0</text><rect x="0" y="766" width="390" height="78" rx="0" fill="#1b211d"/><line x1="0" y1="766" x2="390" y2="766" stroke="#343d35" stroke-width="1"/><path d="M62 799 L71 791 L80 799 V814 H62 Z" stroke="#a0aba1" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 814 V803 H74 V814" stroke="#a0aba1" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="831" font-family="Arial,sans-serif" font-size="10" fill="#a0aba1" font-weight="600" text-anchor="middle">Overview</text><rect x="170" y="752" width="50" height="50" rx="0" fill="#c5f17c"/><line x1="184" y1="777" x2="206" y2="777" stroke="#172017" stroke-width="2"/><line x1="195" y1="766" x2="195" y2="788" stroke="#172017" stroke-width="2"/><path d="M310 790 V815 H33