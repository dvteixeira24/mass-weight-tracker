<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="MASS mobile weight tracker 05-onboarding.svg screen"><defs><linearGradient id="grad" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#c5f17c" stop-opacity=".23"/><stop offset="1" stop-color="#c5f17c" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="390" height="844" rx="0" fill="#151917"/><rect x="26" y="33" width="4" height="15" rx="0" fill="#c5f17c"/><rect x="33" y="38" width="4" height="10" rx="0" fill="#c5f17c"/><rect x="40" y="29" width="4" height="19" rx="0" fill="#c5f17c"/><text x="57" y="48" font-family="Arial,sans-serif" font-size="24" fill="#f2f3eb" font-weight="750" text-anchor="start" letter-spacing="-1.1">mass</text><text x="110" y="48" font-family="Arial,sans-serif" font-size="24" fill="#c5f17c" font-weight="750" text-anchor="start">.</text><rect x="27" y="91" width="336" height="191" rx="0" fill="#1d2420" stroke="#343d35" stroke-width="1"/><line x1="43" y1="134" x2="348" y2="134" stroke="#344138" stroke-width="1" stroke-dasharray="2 5"/><line x1="43" y1="180" x2="348" y2="180" stroke="#344138" stroke-width="1" stroke-dasharray="2 5"/><line x1="43" y1="226" x2="348" y2="226" stroke="#344138" stroke-width="1" stroke-dasharray="2 5"/><path d="M 43 246 L 75 242 L 111 228 L 143 231 L 175 207 L 207 207 L 240 178 L 272 184 L 314 151 L 348 116 L 348 280 L 43 280 Z" stroke="none" fill="url(#grad)" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 43 246 L 75 242 L 111 228 L 143 231 L 175 207 L 207 207 L 240 178 L 272 184 L 314 151 L 348 116" stroke="#c5f17c" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="348" cy="116" r="8" fill="#c5f17c" opacity="0.18"/><circle cx="348" cy="116" r="4" fill="#c5f17c"/><text x="27" y="328" font-family="Arial,sans-serif" font-size="10" fill="#a0aba1" font-weight="700" text-anchor="start" letter-spacing="1">A SMALL HABIT, A CLEARER PICTURE</text><text x="27" y="385" font-family="Georgia,serif" font-size="47" fill="#f2f3eb" font-weight="400" text-anchor="start">Track the</text><text x="27" y="434" font-family="Georgia,serif" font-size="47" fill="#f2f3eb" font-weight="400" text-anchor="start">little changes</text><text x="336" y="434" font-family="Georgia,serif" font-size="47" fill="#c5f17c" font-weight="400" text-anchor="start">.</text><text x="27" y="469" font-family="Arial,sans-serif" font-size="13" fill="#a0aba1" font-weight="400" text-anchor="start">One number a day. A better understanding</text><text x="27" y="487" font-family="Arial,sans-serif" font-size="13" fill="#a0aba1" font-weight="400" text-anchor="start">of your progress over time.</text><text x="27" y="529" font-family="Arial,sans-serif" font-size="10" fill="#a0aba1" font-weight="700" text-anchor="start" letter-spacing="1.3">PREFERRED UNIT</text><rect x="27" y="541" width="162" height="54" rx="0" fill="#1d2420" stroke="#c5f17c" stroke-width="1"/><rect x="198" y="541" width="165" height="54" rx="0" fill="#1d2420" stroke="#343d35" stroke-width="1"/><text x="41" y="574" font-family="Arial,sans-serif" font-size="13" fill="#f2f3eb" font-weight="600" text-anchor="start">Kilograms</text><text x="176" y="574" font-family="Arial,sans-serif" font-size="11" fill="#c5f17c" font-weight="600" text-anchor="end">kg</text><text x="212" y="574" font-family="Arial,sans-serif" font-size="13" fill="#f2f3eb" font-weight="600" text-anchor="start">Pounds</text><text x="349" y="574" font-family="Arial,sans-serif" font-size="11" fill="#a0aba1" font-weight="600" text-anchor="end">lb</text><text x="27" y="630" font-family="Arial,sans-serif" font-size="10" fill="#a0aba1" font-weight="700" text-anchor="start" letter-spacing="1.1">STARTING WEIGHT  (OPTIONAL)</text><rect x="27" y="640" width="336" height="52" rx="0" fill="#1d2420" stroke="#343d35" stroke-width="1"/><text x="43" y="670" font-family="Arial,sans-serif" font-size="14" fill="#77877a" font-weight="400" text-anchor="start">e.g. 60.0</text><text x="348" y="670" font-family="Arial,sans-serif" font-size="13" fill="#a0aba1" font-weight="400" text-anchor="end">kg</text><rect x="27" y="714" width="336" height="53" rx="0" fill="#c5f17c"/><text x="44" y="746" font-family="Arial,sans-serif" font-size="14" fill="#172017" font-weight="700" text-anchor="start">Get started</text><path d="M331 750 L348 733 M337 733 H348 V744" stroke="#172017" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="195" y="790" font-family="Arial,sans-serif" font-size="10" fill="#77877a" font-weight="400" text-anchor="middle">No account needed. Your data stays in your browser.</text></svg>